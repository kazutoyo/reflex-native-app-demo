# Run `xcodegen generate` to create Weather.xcodeproj
name: Weather
options:
  developmentLanguage: en
  bundleIdPrefix: dev.kazutoyo
  deploymentTarget:
    iOS: "26.0"
packages:
  WeatherCore:
    path: ..
targets:
  Weather:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: WeatherCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Weather
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Used to show the weather where you are.
        NSLocalNetworkUsageDescription: Used during development so the CLI can drive the app.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [reflexweather]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kazutoyo.reflexweather
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: "NO"
